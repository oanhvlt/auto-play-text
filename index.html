<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Đọc Văn Bản Lặp Lại</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #007bff; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #btnStart { background-color: #28a745; }
        #btnStart:hover { background-color: #218838; }
        #btnStop { background-color: #dc3545; }
        #btnStop:hover { background-color: #c82333; }
        #status {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            background-color: #e9ecef;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2>Phần Mềm Đọc Văn Bản Lặp Lại</h2>

    <label for="textInput">Dán đoạn văn của bạn vào đây:</label>
    <textarea id="textInput" placeholder="Nhập hoặc dán văn bản cần đọc...">Xin chào, phần mềm đã sẵn sàng phát âm thanh.</textarea>

    <label for="langSelect">Chọn ngôn ngữ đọc:</label>
    <select id="langSelect">
        <option value="vi-VN" selected>Tiếng Việt</option>
        <option value="en-US">Tiếng Anh (Mỹ)</option>
        <option value="en-GB">Tiếng Anh (Anh)</option>
    </select>

    <label for="speedSelect">Tốc độ đọc:</label>
    <select id="speedSelect">
        <option value="0.7">0.7x (Rất chậm)</option>
        <option value="0.85" selected>0.85x (Chuẩn học tập)</option>
        <option value="1.0">1.0x (Bình thường)</option>
    </select>

    <label for="loopCount">Số lần lặp lại:</label>
    <select id="loopCount">
        <option value="1">1 lần</option>
        <option value="3">3 lần</option>
        <option value="5">5 lần</option>
        <option value="10">10 lần</option>
        <option value="infinite" selected>Lặp vô hạn (như YouTube)</option>
    </select>

    <div class="btn-group">
        <button id="btnStart" onclick="startReading()">Bắt đầu phát</button>
        <button id="btnStop" onclick="stopReading()">Dừng lại</button>
    </div>

    <div id="status">Trạng thái: Sẵn sàng</div>

    <script>
        let currentLoop = 0;
        let maxLoops = 'infinite';
        let isRunning = false;

        function startReading() {
            const text = document.getElementById("textInput").value.trim();
            if (!text) {
                alert("Vui lòng nhập đoạn văn bản trước khi bấm bắt đầu!");
                return;
            }

            // Xóa hoàn toàn hàng đợi cũ để tránh bị kẹt luồng
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            maxLoops = document.getElementById("loopCount").value;
            currentLoop = 0;
            isRunning = true;

            // Đợi một nhịp cực ngắn để hệ thống âm thanh reset xong rồi tiến hành phát
            setTimeout(() => {
                playLoop(text);
            }, 100);
        }

        function playLoop(text) {
            if (!isRunning) return;

            if (maxLoops !== 'infinite' && currentLoop >= parseInt(maxLoops)) {
                document.getElementById("status").innerText = "Trạng thái: Đã hoàn thành " + maxLoops + " lần phát!";
                isRunning = false;
                return;
            }

            currentLoop++;
            let loopTextDisplay = maxLoops === 'infinite' ? " (Vô hạn)" : " / " + maxLoops;
            document.getElementById("status").innerText = "Trạng thái: Đang phát lần thứ " + currentLoop + loopTextDisplay;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = document.getElementById("langSelect").value;
            utterance.rate = parseFloat(document.getElementById("speedSelect").value);

            utterance.onend = function() {
                if (isRunning) {
                    setTimeout(() => {
                        playLoop(text);
                    }, 1200);
                }
            };

            utterance.onerror = function() {
                if (isRunning) {
                    document.getElementById("status").innerText = "Trạng thái: Lỗi phát âm thanh từ trình duyệt.";
                    isRunning = false;
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function stopReading() {
            isRunning = false;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            document.getElementById("status").innerText = "Trạng thái: Đã dừng.";
        }
    </script>

</body>
</html>
