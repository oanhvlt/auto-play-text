<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Đọc Văn Bản Lặp Lại - Giọng AI Cao Cấp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #007bff; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #btnStart { background-color: #28a745; }
        #btnStart:hover { background-color: #218838; }
        #btnStop { background-color: #dc3545; }
        #btnStop:hover { background-color: #c82333; }
        #status {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            background-color: #e9ecef;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2>Phần Mềm Đọc Văn Bản Lặp Lại (Giọng AI)</h2>

    <label for="textInput">Dán đoạn văn của bạn vào đây:</label>
    <textarea id="textInput" placeholder="Nhập hoặc dán văn bản cần đọc...">Have you had any experience working with or integrating AI agents into your testing workflow?</textarea>

    <label for="voiceSelect">Chọn giọng đọc AI:</label>
    <select id="voiceSelect">
        <option value="en-US-AriaNeural" selected>Tiếng Anh Mỹ - Nữ (Aria AI Cực mượt)</option>
        <option value="en-US-GuyNeural">Tiếng Anh Mỹ - Nam (Guy AI)</option>
        <option value="en-GB-SoniaNeural">Tiếng Anh Anh - Nữ (Sonia AI)</option>
        <option value="vi-VN-HoaiMyNeural">Tiếng Việt - Nữ (Hoài Mỹ AI)</option>
    </select>

    <label for="loopCount">Số lần lặp lại:</label>
    <select id="loopCount">
        <option value="1">1 lần</option>
        <option value="3">3 lần</option>
        <option value="5">5 lần</option>
        <option value="10">10 lần</option>
        <option value="infinite" selected>Lặp vô hạn (như YouTube)</option>
    </select>

    <div class="btn-group">
        <button id="btnStart" onclick="startReading()">Bắt đầu phát</button>
        <button id="btnStop" onclick="stopReading()">Dừng lại</button>
    </div>

    <div id="status">Trạng thái: Đang chờ...</div>

    <!-- Thẻ Audio dùng để phát stream âm thanh AI trực tiếp -->
    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        let currentLoop = 0;
        let maxLoops = 'infinite';
        let isRunning = false;
        let audioPlayer = document.getElementById("audioPlayer");

        function startReading() {
            const text = document.getElementById("textInput").value.trim();
            if (!text) {
                alert("Vui lòng nhập đoạn văn bản trước khi bấm bắt đầu!");
                return;
            }

            audioPlayer.pause();
            audioPlayer.currentTime = 0;

            maxLoops = document.getElementById("loopCount").value;
            currentLoop = 0;
            isRunning = true;

            playLoop(text);
        }

        function playLoop(text) {
            if (!isRunning) return;

            if (maxLoops !== 'infinite' && currentLoop >= parseInt(maxLoops)) {
                document.getElementById("status").innerText = "Trạng thái: Đã hoàn thành " + maxLoops + " lần phát!";
                isRunning = false;
                return;
            }

            currentLoop++;
            let loopTextDisplay = maxLoops === 'infinite' ? " (Vô hạn)" : " / " + maxLoops;
            document.getElementById("status").innerText = "Trạng thái: Đang phát lần thứ " + currentLoop + loopTextDisplay;

            const voice = document.getElementById("voiceSelect").value;
            
            // Sử dụng dịch vụ công cộng stream âm thanh TTS chất lượng cao
            const encodedText = encodeURIComponent(text);
            const audioUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voice}&text=${encodedText}`;

            audioPlayer.src = audioUrl;
            audioPlayer.play().catch(error => {
                document.getElementById("status").innerText = "Trạng thái: Lỗi kết nối âm thanh AI.";
                isRunning = false;
            });

            audioPlayer.onended = function() {
                if (isRunning) {
                    // Nghỉ 1 giây giữa các vòng lặp giống YouTube
                    setTimeout(() => {
                        playLoop(text);
                    }, 1000);
                }
            };
        }

        function stopReading() {
            isRunning = false;
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            document.getElementById("status").innerText = "Trạng thái: Đã dừng.";
        }
    </script>

</body>
</html>
