<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Đọc Văn Bản Lặp Lại - Ngắt Câu Tự Động</title>
    <!-- Nhúng thư viện đọc văn bản chất lượng cao ResponsiveVoice -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=free"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #007bff; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-size: 14px;
            box-sizing: border-box;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #btnStart { background-color: #28a745; }
        #btnStart:hover { background-color: #218838; }
        #btnStop { background-color: #dc3545; }
        #btnStop:hover { background-color: #c82333; }
        #status {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            background-color: #e9ecef;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2>Phần Mềm Đọc Văn Bản Lặp Lại</h2>

    <label for="textInput">Dán đoạn văn của bạn vào đây:</label>
    <textarea id="textInput" placeholder="Nhập hoặc dán văn bản cần đọc...">Have you had any experience working with or integrating AI agents into your testing workflow? Let's check it out.</textarea>

    <label for="voiceSelect">Chọn giọng đọc:</label>
    <select id="voiceSelect">
        <option value="UK English Female" selected>Tiếng Anh (UK - Nữ cực chuẩn)</option>
        <option value="US English Female">Tiếng Anh (US - Nữ chuẩn)</option>
        <option value="UK English Male">Tiếng Anh (UK - Nam)</option>
        <option value="Vietnamese Male">Tiếng Việt (Nam)</option>
    </select>

    <label for="loopCount">Số lần lặp lại:</label>
    <select id="loopCount">
        <option value="1">1 lần</option>
        <option value="3">3 lần</option>
        <option value="5">5 lần</option>
        <option value="10">10 lần</option>
        <option value="infinite" selected>Lặp vô hạn (như YouTube)</option>
    </select>

    <div class="btn-group">
        <button id="btnStart" onclick="startReading()">Bắt đầu phát</button>
        <button id="btnStop" onclick="stopReading()">Dừng lại</button>
    </div>

    <div id="status">Trạng thái: Đang chờ...</div>

    <script>
        let currentLoop = 0;
        let maxLoops = 'infinite';
        let isRunning = false;
        let sentences = [];
        let currentSentenceIndex = 0;
        let fullText = "";

        function startReading() {
            fullText = document.getElementById("textInput").value.trim();
            if (!fullText) {
                alert("Vui lòng nhập đoạn văn bản trước khi bấm bắt đầu!");
                return;
            }

            if (typeof responsiveVoice !== "undefined") {
                responsiveVoice.cancel();
            }

            maxLoops = document.getElementById("loopCount").value;
            currentLoop = 0;
            isRunning = true;

            // Tách đoạn văn thành các câu nhỏ dựa trên dấu câu (. ? ! ;)
            // Giữ lại dấu câu để ngữ điệu tự nhiên hơn
            sentences = fullText.match(/[^.?!;]+[.?!;]+["']?|[^.?!;]+$/g) || [fullText];
            sentences = sentences.map(s => s.trim());
            currentSentenceIndex = 0;

            playNextSentence();
        }

        function playNextSentence() {
            if (!isRunning) return;

            // Nếu đã đọc hết các câu trong 1 vòng lặp
            if (currentSentenceIndex >= sentences.length) {
                currentLoop++;
                
                // Kiểm tra xem đã đạt số lần lặp tối đa chưa
                if (maxLoops !== 'infinite' && currentLoop >= parseInt(maxLoops)) {
                    document.getElementById("status").innerText = "Trạng thái: Đã hoàn thành " + maxLoops + " lần phát!";
                    isRunning = false;
                    return;
                }

                // Bắt đầu vòng lặp mới từ câu đầu tiên
                currentSentenceIndex = 0;
                setTimeout(() => {
                    playNextSentence();
                }, 1000); // Nghỉ 1 giây trước khi lặp lại từ đầu đoạn
                return;
            }

            let loopTextDisplay = maxLoops === 'infinite' ? " (Vô hạn)" : " / " + maxLoops;
            document.getElementById("status").innerText = "Trạng thái: Vòng " + (currentLoop + 1) + loopTextDisplay + " - Đang đọc câu " + (currentSentenceIndex + 1) + "/" + sentences.length;

            const selectedVoice = document.getElementById("voiceSelect").value;
            const currentSentence = sentences[currentSentenceIndex];

            if (typeof responsiveVoice === "undefined") {
                document.getElementById("status").innerText = "Trạng thái: Đang tải thư viện...";
                isRunning = false;
                return;
            }

            // Đọc từng câu một, tự động ngắt nghỉ khi gặp dấu câu
            responsiveVoice.speak(currentSentence, selectedVoice, {
                rate: 1.0,
                onend: function() {
                    if (isRunning) {
                        currentSentenceIndex++;
                        // Nghỉ ngắn 0.3 giây giữa các câu trong cùng một đoạn
                        setTimeout(() => {
                            playNextSentence();
                        }, 300);
                    }
                }
            });
        }

        function stopReading() {
            isRunning = false;
            if (typeof responsiveVoice !== "undefined") {
                responsiveVoice.cancel();
            }
            document.getElementById("status").innerText = "Trạng thái: Đã dừng.";
        }
    </script>

</body>
</html>
